name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: backend-and-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend unit and PostgreSQL integration tests
        run: ./gradlew test --no-daemon
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend

  container-e2e:
    name: container-and-two-browser-e2e
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: minigame:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build immutable application image
        run: docker build --tag "${APP_IMAGE}" .
      - name: Verify Compose selects the immutable image
        shell: bash
        run: docker compose config --images | grep --fixed-strings --line-regexp "${APP_IMAGE}"
      - name: Start application and PostgreSQL
        run: docker compose up --detach --no-build
      - name: Wait for application readiness
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness; do
            if (( SECONDS >= deadline )); then
              docker compose ps
              docker compose logs app postgres
              exit 1
            fi
            sleep 2
          done
      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Two-browser room and chat E2E
        run: npm test
        working-directory: e2e
      - name: Package the verified delivery candidate
        shell: bash
        run: |
          mkdir --parents delivery
          docker save --output delivery/minigame-image.tar "${APP_IMAGE}"
          image_id="$(docker image inspect --format '{{.Id}}' "${APP_IMAGE}")"
          archive_sha="$(sha256sum delivery/minigame-image.tar | cut --delimiter=' ' --fields=1)"
          {
            printf 'GIT_SHA=%q\n' "${GITHUB_SHA}"
            printf 'APP_IMAGE=%q\n' "${APP_IMAGE}"
            printf 'IMAGE_ID=%q\n' "${image_id}"
            printf 'ARCHIVE_SHA256=%q\n' "${archive_sha}"
          } > delivery/candidate.env
      - name: Upload verified delivery candidate
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: delivery
          compression-level: 0
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Stop application
        if: always()
        run: docker compose down --volumes

  preview-contract:
    name: preview-cloud-run-deployment
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: container-e2e
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: cloud-run-preview
      cancel-in-progress: true
    outputs:
      image_digest: ${{ steps.deploy.outputs.image_digest }}
    permissions:
      contents: read
      id-token: write
    env:
      APP_ALLOWED_ORIGINS: ${{ vars.APP_ALLOWED_ORIGINS }}
      APP_IMAGE: minigame:${{ github.sha }}
      APP_SESSION_SECRET_NAME: ${{ vars.APP_SESSION_SECRET_NAME }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_RUN_SERVICE: minigame-preview
      CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_PASSWORD_SECRET_NAME: ${{ vars.DB_PASSWORD_SECRET_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      GCP_ARTIFACT_IMAGE: minigame
      GCP_ARTIFACT_REPOSITORY: minigame
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      IP_HASH_SECRET_NAME: ${{ vars.IP_HASH_SECRET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: delivery
      - name: Verify preview uses the tested image artifact
        run: bash .github/scripts/verify-delivery-candidate.sh delivery
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy verified preview image
        id: deploy
        run: bash .github/scripts/deploy-cloud-run.sh
      - name: Verify preview readiness
        shell: bash
        run: |
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "${service_url}/actuator/health/readiness"

  production-contract:
    name: production-cloud-run-deployment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: preview-contract
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      APP_ALLOWED_ORIGINS: ${{ vars.APP_ALLOWED_ORIGINS }}
      APP_IMAGE: minigame:${{ github.sha }}
      APP_SESSION_SECRET_NAME: ${{ vars.APP_SESSION_SECRET_NAME }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_RUN_SERVICE: minigame
      CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_PASSWORD_SECRET_NAME: ${{ vars.DB_PASSWORD_SECRET_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.preview-contract.outputs.image_digest }}
      GCP_ARTIFACT_IMAGE: minigame
      GCP_ARTIFACT_REPOSITORY: minigame
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      IP_HASH_SECRET_NAME: ${{ vars.IP_HASH_SECRET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: delivery
      - name: Verify production uses the previewed image artifact
        run: bash .github/scripts/verify-delivery-candidate.sh delivery
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy approved production image
        run: bash .github/scripts/deploy-cloud-run.sh
      - name: Verify production readiness
        shell: bash
        run: |
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "${service_url}/actuator/health/readiness"
