name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: backend-and-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend unit and PostgreSQL integration tests
        run: ./gradlew test --no-daemon
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend

  container-e2e:
    name: container-and-two-browser-e2e
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build immutable application image
        run: docker build --tag minigame:${{ github.sha }} .
      - name: Start application and PostgreSQL
        run: docker compose up --detach --build
      - name: Wait for application readiness
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness; do
            if (( SECONDS >= deadline )); then
              docker compose ps
              docker compose logs app postgres
              exit 1
            fi
            sleep 2
          done
      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Two-browser room and chat E2E
        run: npm test
        working-directory: e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Stop application
        if: always()
        run: docker compose down --volumes

  preview-contract:
    name: preview-delivery-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-e2e
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Record verified preview candidate
        run: echo "preview candidate=${GITHUB_SHA} (Cloud Run deployment hook intentionally not enabled yet)"

  production-contract:
    name: production-delivery-contract
    needs: preview-contract
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record approved production candidate
        run: echo "production candidate=${GITHUB_SHA} (configure required reviewers on the production environment)"
