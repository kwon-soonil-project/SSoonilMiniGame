services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minigame
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: local-minigame
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame"]
      interval: 5s
      timeout: 3s
      retries: 10
