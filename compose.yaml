services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minigame
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: local-minigame
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minigame
      DB_USER: minigame
      DB_PASSWORD: local-minigame
      APP_SESSION_SECRET: local-compose-session-signing-key-at-least-32-bytes
      APP_SESSION_SECURE: "false"
      APP_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
