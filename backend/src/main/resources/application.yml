spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minigame}
    username: ${DB_USER:minigame}
    password: ${DB_PASSWORD:local-minigame}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
